name: Atlas catalogue validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Run catalogue tests
        run: python -m unittest discover -s tests -v
      - name: Validate and export catalogue
        run: |
          python -m atlas_catalogue.validator --export-json "$RUNNER_TEMP/catalogue-1.json"
          python -m atlas_catalogue.validator --export-json "$RUNNER_TEMP/catalogue-2.json"
          cmp "$RUNNER_TEMP/catalogue-1.json" "$RUNNER_TEMP/catalogue-2.json"
          python -m json.tool "$RUNNER_TEMP/catalogue-1.json" > /dev/null
